<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Cheap Part That Can Stop the Factory</title>
  <desc id="desc">A small semiconductor component sits at the center of a dependency map connecting production, legal, export, and automotive nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1730"/><stop offset="1" stop-color="#182f4f"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d98a"/><stop offset="1" stop-color="#8ab7c8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".14" stroke="#bcd0dc" stroke-width="1"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600"/><path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/></g>
  <g fill="none" stroke="url(#line)" stroke-width="5" opacity=".82"><path d="M800 430 C620 300 430 220 250 190"/><path d="M800 430 C1050 300 1260 230 1400 190"/><path d="M800 470 C590 560 410 620 230 700"/><path d="M800 470 C1040 560 1230 650 1400 700"/></g>
  <g fill="#f4e2a2" filter="url(#glow)"><circle cx="250" cy="190" r="10"/><circle cx="1400" cy="190" r="10"/><circle cx="230" cy="700" r="10"/><circle cx="1400" cy="700" r="10"/></g>
  <g transform="translate(690 330)"><rect width="220" height="190" rx="18" fill="#101f39" stroke="#f2d98a" stroke-width="6"/><rect x="35" y="35" width="150" height="120" rx="8" fill="#254c63"/><path d="M65 65H155M65 95H155M65 125H155" stroke="#d9edf0" stroke-width="6" opacity=".85"/><path d="M-20 35H0M-20 75H0M-20 115H0M220 35H240M220 75H240M220 115H240" stroke="#f2d98a" stroke-width="8"/></g>
  <g fill="#e8f1f2" font-family="Arial,sans-serif" letter-spacing="3"><text x="128" y="150" font-size="25">PRODUCTION</text><text x="1260" y="150" font-size="25">EXPORT RULE</text><text x="110" y="760" font-size="25">LEGAL ENTITY</text><text x="1190" y="760" font-size="25">FACTORY LINE</text></g>
  <text x="800" y="625" text-anchor="middle" fill="#f6e7b1" font-family="Georgia,serif" font-size="48" letter-spacing="3">THE CHEAP PART THAT CAN STOP THE FACTORY</text>
  <text x="800" y="680" text-anchor="middle" fill="#a9c3d1" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">BEACON SIGNAL · WATCH BRIEF</text>
