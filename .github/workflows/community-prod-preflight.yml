name: Beacon Community Production Preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    name: Inspect Beacon Community release path
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect release path without modifying production
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.PRODUCTION_SERVER_IP }} 'bash -s' <<'REMOTE'
            set -euo pipefail
            release_root='/var/www/beacon-community'
            current_release="${release_root}/current"

            echo '=== Beacon Community release layout ==='
            ls -ld "${release_root}" "${current_release}" "${release_root}/releases" "${release_root}/shared" 2>/dev/null || true
            readlink -f "${current_release}" 2>/dev/null || true
            find "${release_root}" -maxdepth 2 -mindepth 1 -type d -printf '%p\n' 2>/dev/null | sort | head -n 50

            echo '=== Current release Git state ==='
            git -C "${current_release}" remote -v 2>/dev/null || true
            git -C "${current_release}" branch -vv 2>/dev/null || true
            git -C "${current_release}" status --short 2>/dev/null || true
            git -C "${current_release}" log -1 --oneline 2>/dev/null || true
            [ -f "${current_release}/package.json" ] && grep -E '"(name|build|start)"' "${current_release}/package.json" || true

            echo '=== Beacon Community process ==='
            pm2 describe beacon-community 2>/dev/null || true

            echo '=== Nginx server mapping ==='
            grep -R "server_name.*beaconcommunity.net" /etc/nginx/sites-enabled 2>/dev/null || true
          REMOTE
