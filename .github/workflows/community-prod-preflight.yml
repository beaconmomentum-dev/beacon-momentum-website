name: Beacon Production Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beacon-production-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only production release inspection
    runs-on: ubuntu-latest
    steps:
      - name: Setup production SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.PRODUCTION_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PRODUCTION_SERVER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect Community release path without modifying production
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no \
            root@"${{ secrets.PRODUCTION_SERVER_IP }}" 'bash -s' <<'REMOTE'
            set -euo pipefail
            release_root='/var/www/beacon-community'
            current_release="${release_root}/current"

            echo '=== Beacon Community release layout ==='
            ls -ld "${release_root}" "${current_release}" "${release_root}/releases" "${release_root}/shared" 2>/dev/null || true
            readlink -f "${current_release}" 2>/dev/null || true
            find "${release_root}" -maxdepth 2 -mindepth 1 -type d -printf '%p\n' 2>/dev/null | sort | head -n 50

            echo '=== Community Git state ==='
            if git -C "${current_release}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              printf 'branch='; git -C "${current_release}" branch --show-current
              printf 'commit='; git -C "${current_release}" rev-parse HEAD
              git -C "${current_release}" status --short
            else
              echo 'git_worktree=no'
            fi

            echo '=== Community process and Nginx ==='
            pm2 list | sed -n '1,12p'
            printf 'community_pid='; pm2 pid beacon-community 2>/dev/null || true
            grep -R "server_name.*beaconcommunity.net" /etc/nginx/sites-enabled 2>/dev/null || true
          REMOTE

      - name: Inspect Marketing host installer without modifying production
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no \
            root@"${{ secrets.PRODUCTION_SERVER_IP }}" 'bash -s' <<'REMOTE'
            set -euo pipefail
            app='/var/www/beacon-momentum-www'
            installer='/usr/local/bin/deploy-beacon-www.sh'

            echo '=== Marketing Git state ==='
            if git -C "$app" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              printf 'branch='; git -C "$app" branch --show-current
              printf 'commit='; git -C "$app" rev-parse HEAD
              printf 'origin='; git -C "$app" remote get-url origin 2>/dev/null | sed -E 's#(https?://)[^/@]+@#\1REDACTED@#' || true
              echo 'working_tree_paths:'
              git -C "$app" status --short
              echo 'lockfile_hashes:'
              for f in package.json pnpm-lock.yaml package-lock.json; do
                if [ -f "$app/$f" ]; then sha256sum "$app/$f"; fi
              done
            else
              echo 'git_worktree=no'
            fi

            echo '=== Marketing runtime versions ==='
            for tool in node npm pnpm corepack; do
              if command -v "$tool" >/dev/null 2>&1; then
                printf '%s=' "$tool"
                "$tool" --version 2>/dev/null | head -n 1 || true
              else
                printf '%s=not-installed\n' "$tool"
              fi
            done

            echo '=== Marketing environment readiness (values hidden) ==='
            env_file="$app/.env.production"
            if [ -r "$env_file" ]; then
              for key in VITE_OAUTH_PORTAL_URL VITE_APP_ID DATABASE_URL JWT_SECRET OAUTH_SERVER_URL GHL_API_KEY; do
                if grep -Eq "^[[:space:]]*(export[[:space:]]+)?${key}=" "$env_file"; then
                  printf '%s=present\n' "$key"
                else
                  printf '%s=missing\n' "$key"
                fi
              done
              watch_flag="$(awk -F= '/^[[:space:]]*(export[[:space:]]+)?WATCH_LIVE_CHECKOUT_ENABLED=/ { gsub(/[[:space:]"\047]/, "", $2); print $2 }' "$env_file" | tail -n 1)"
              printf 'WATCH_LIVE_CHECKOUT_ENABLED=%s\n' "${watch_flag:-unset}"
              if grep -Eq '^[[:space:]]*(export[[:space:]]+)?STRIPE_WATCH_ANNUAL_PRICE_ID=' "$env_file"; then
                echo 'STRIPE_WATCH_ANNUAL_PRICE_ID=present'
              else
                echo 'STRIPE_WATCH_ANNUAL_PRICE_ID=missing'
              fi
            else
              echo 'production_env_file=unavailable'
            fi

            echo '=== Installer metadata only ==='
            if [ -r "$installer" ]; then
              stat -c 'present=yes mode=%a owner=%U size=%s modified=%y' "$installer"
              echo 'sanitized_installer_source:'
              sed -E 's/^([[:space:]]*(export[[:space:]]+)?[A-Za-z_]*(KEY|TOKEN|SECRET|PASSWORD|DATABASE_URL)[A-Za-z_]*=).*/\1[REDACTED]/I' "$installer" | nl -ba
              awk '
                /npm[[:space:]]+ci/ { print NR ": npm ci" }
                /npm[[:space:]]+install/ { print NR ": npm install" }
                /npm[[:space:]]+run[[:space:]]+build/ { print NR ": npm run build" }
                /pnpm[[:space:]]+install/ { print NR ": pnpm install" }
                /pnpm[[:space:]]+run[[:space:]]+build/ { print NR ": pnpm run build" }
                /yarn[[:space:]]+install/ { print NR ": yarn install" }
                /corepack/ { print NR ": corepack invocation" }
                /package-lock\.json/ { print NR ": references package-lock.json" }
                /pnpm-lock\.yaml/ { print NR ": references pnpm-lock.yaml" }
              ' "$installer"
            else
              echo 'installer_present=no'
            fi

            echo '=== Marketing process health ==='
            pm2 list | sed -n '1,12p'
            printf 'marketing_pid='; pm2 pid beacon-momentum-www 2>/dev/null || true
            pm2 jlist | node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const apps = JSON.parse(raw);
                const app = apps.find(item => item.name === "beacon-momentum-www");
                if (!app) { console.log("marketing_process_metadata=not-found"); return; }
                const env = app.pm2_env.env || app.pm2_env;
                console.log(`marketing_script=${app.pm2_env.pm_exec_path || "unknown"}`);
                console.log(`marketing_cwd=${app.pm2_env.pm_cwd || "unknown"}`);
                console.log(`marketing_status=${app.pm2_env.status || "unknown"}`);
                for (const key of ["BEACON_REPO_ROOT", "BEACON_SITE_ROOT", "BEACON_ENV_FILE"]) {
                  if (env[key]) console.log(`${key}=${env[key]}`);
                }
              });
            '
          REMOTE
