name: Post-Deployment Production Smoke Test

on:
  workflow_run:
    workflows:
      - Deploy to Production
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: post-deployment-smoke-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify production after successful deployment
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Run read-only Titles 7–9 production smoke test
        env:
          BASE_URL: https://beaconmomentum.com
          EXPECTED_DATE: November 15, 2026
        run: |
          set -o pipefail
          bash ops/beacon-titles789-post-deployment-smoke.sh 2>&1 | tee post-deployment-smoke.log

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deployment-smoke-${{ github.event.workflow_run.id }}
          path: post-deployment-smoke.log
          if-no-files-found: error
          retention-days: 14
