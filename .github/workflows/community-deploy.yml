name: Retired — Community deployment moved

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Stop legacy deployment path
    runs-on: ubuntu-24.04
    steps:
      - name: Direct operators to the Community release workflow
        run: |
          echo "::error title=Retired workflow::This Marketing-hosted Community deployment path is retired."
          echo "Use the manual archive-based release workflow in beaconmomentum-dev/beacon-community after its CI and read-only production preflight pass."
          echo "No server connection, Git operation, or production change was attempted."
          exit 1
