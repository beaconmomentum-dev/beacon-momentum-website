name: Diagnose Beacon Public Origin

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Inspect active Beacon public-origin mapping
    runs-on: ubuntu-latest
    steps:
      - name: Set up production SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Collect read-only origin mapping evidence
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.PRODUCTION_SERVER_IP }} 'bash -s' <<'REMOTE'
            set -euo pipefail
            echo '--- active beaconmomentum.com virtual-host blocks ---'
            nginx -T 2>/dev/null > /tmp/nginx-effective.conf
            awk 'BEGIN{RS="}"} /server_name[^;]*beaconmomentum\\.com/ {print $0 "}"}' /tmp/nginx-effective.conf || true
            echo '--- candidate index documents ---'
            find /var/www -path '*/dist/public/index.html' -type f -printf '%p\n' | sort | while read -r path; do
              printf '%s ' "$path"
              grep -oE '/assets/index-[^" ]+\.js' "$path" | head -1 || true
            done
            echo '--- running Beacon listeners ---'
            ss -ltnp | grep -E ':3012|:3014|:3000' || true
            echo '--- pm2 Beacon processes ---'
            pm2 jlist | jq -r '.[] | select(.name | test("beacon"; "i")) | [.name, .pm2_env.status, .pm2_env.pm_cwd, (.pm2_env.env.PORT // ""), (.pm2_env.args | tostring)] | @tsv'
            echo '--- local entry-document probes ---'
            for port in $(ss -ltnp | awk '/node|docker-proxy/ && $4 ~ /:30(0[0-9]|1[0-9]|2[0-9])$/ {sub(/.*:/, "", $4); print $4}' | sort -u); do
              entry=$(curl -sS --max-time 3 -H 'Host: beaconmomentum.com' "http://127.0.0.1:${port}/guides" | grep -oE '/assets/index-[^\" ]+\\.js' | head -1 || true)
              printf 'port=%s entry=%s\\n' "$port" "$entry"
            done
          REMOTE
