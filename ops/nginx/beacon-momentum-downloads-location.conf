# Beacon Momentum public resource downloads.
#
# This prefix must appear before the singular `/download` Guides Store route.
# Nginx prefix matching then sends `/downloads/...` to the public Beacon
# Momentum runtime on port 3012 rather than the Guides Store on port 3020.
location ^~ /downloads/ {
    proxy_pass http://127.0.0.1:3012;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}
